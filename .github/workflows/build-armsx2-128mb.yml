name: Build ARMSX2 128MB Test

on:
  push:
    branches:
      - chatgpt/armsx2-128mb-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout ARMSX2 source
        uses: actions/checkout@v4
        with:
          repository: SgtBilko76/ARMSX2-3D
          ref: quest-vr-stereo
          path: armsx2
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build dependencies
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Patch ARM64 EE recompiler for 128MB
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("armsx2")
          p = root / "pcsx2/arm64/iR5900-arm64.cpp"
          s = p.read_text()

          pairs = [
              ("static u16 manual_page[Ps2MemSize::MainRam / 4096] = {};",
               "static u16 manual_page[Ps2MemSize::TotalRam / 4096] = {};"),
              ("static u8 manual_counter[Ps2MemSize::MainRam / 4096] = {};",
               "static u8 manual_counter[Ps2MemSize::TotalRam / 4096] = {};"),
              ("recLutEntries = (Ps2MemSize::MainRam + Ps2MemSize::Rom + Ps2MemSize::Rom1 + Ps2MemSize::Rom2) / 4;",
               "recLutEntries = (Ps2MemSize::ExposedRam + Ps2MemSize::Rom + Ps2MemSize::Rom1 + Ps2MemSize::Rom2) / 4;"),
              ("curpos += (Ps2MemSize::MainRam / 4);",
               "curpos += (Ps2MemSize::ExposedRam / 4);"),
              ("if (recRAMCopy.size() != Ps2MemSize::MainRam)\n\t\trecRAMCopy.resize(Ps2MemSize::MainRam);",
               "if (recRAMCopy.size() != Ps2MemSize::ExposedRam)\n\t\trecRAMCopy.resize(Ps2MemSize::ExposedRam);"),
              ("Ps2MemSize::MainRam + Ps2MemSize::Rom + Ps2MemSize::Rom1 + Ps2MemSize::Rom2);",
               "Ps2MemSize::ExposedRam + Ps2MemSize::Rom + Ps2MemSize::Rom1 + Ps2MemSize::Rom2);"),
              ("if (HWADDR(pc) <= Ps2MemSize::MainRam)",
               "if (HWADDR(pc) <= Ps2MemSize::ExposedRam)"),
              ("Ps2MemSize::MainRam - oldBlock->startpc);",
               "Ps2MemSize::ExposedRam - oldBlock->startpc);"),
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit(f"missing expected source: {old[:100]}")
              s = s.replace(old, new)

          old_map = """\t// Map EE RAM (32MB, mirrored)
\tfor (int i = 0; i < 0x200; i++)
\t{
\t\tu32 mask = (Ps2MemSize::MainRam / _64kb) - 1;
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x0000, i, i & mask);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x2000, i, i & mask);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x3000, i, i & mask);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x8000, i, i & mask);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xa000, i, i & mask);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xb000, i, i & mask);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xc000, i, i & mask);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xd000, i, i & mask);
\t}
"""
          new_map = """\t// Map all exposed EE RAM, including the 96 MB devkit extension.
\tfor (int i = 0; i < static_cast<int>(Ps2MemSize::ExposedRam / _64kb); i++)
\t{
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x0000, i, i);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x2000, i, i);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x3000, i, i);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x8000, i, i);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xa000, i, i);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xb000, i, i);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xc000, i, i);
\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xd000, i, i);
\t}
"""
          if old_map not in s:
              raise SystemExit("missing 32MB recLUT map block")
          s = s.replace(old_map, new_map)

          old_comment = """\t// MainRam, deliberately — this whole rec is MainRam-only: recLutEntries and
\t// the recRAM advance above, the (MainRam / _64kb) alias mask in recResetRaw,
\t// and manual_page / manual_counter. Upstream x86 uses ExposedRam throughout
\t// instead (iR5900.cpp:564-577). Widening this buffer alone would desync the
\t// snapshots from a LUT that aliases high RAM back into the low 32 MB.
"""
          s = s.replace(old_comment, "\t// Snapshot every byte of currently exposed EE RAM.\n")
          p.write_text(s)

          p = root / "pcsx2/Memory.cpp"
          s = p.read_text()
          start = s.index("void memSetExtraMemMode(bool mode)\n{")
          marker = "\n\t// update the amount of RAM exposed to the VM"
          end = s.index(marker, start)
          s = s[:start] + """void memSetExtraMemMode(bool mode)
{
\t// NEXT 27 test build: always expose the full devkit memory map.
\tmode = true;
""" + s[end:]
          p.write_text(s)

          p = root / "pcsx2/Pcsx2Config.cpp"
          s = p.read_text()
          if "\tExtraMemory = false;" not in s:
              raise SystemExit("missing ExtraMemory default")
          p.write_text(s.replace("\tExtraMemory = false;", "\tExtraMemory = true;", 1))
          PY

          echo "Check for remaining 32 MB-only ARM64 assumptions:"
          if grep -n 'Ps2MemSize::MainRam' armsx2/pcsx2/arm64/iR5900-arm64.cpp; then
            exit 1
          fi
          if grep -n 'Extended RAM (128MB) is not supported' armsx2/pcsx2/Memory.cpp; then
            exit 1
          fi

      - name: Build universal 4K/16K Android APK
        shell: bash
        run: |
          cd armsx2/platforms/android
          chmod +x gradlew tools/build-universal-page-apk.sh
          ./tools/build-universal-page-apk.sh --application-id com.armsx2.next128 "$GITHUB_WORKSPACE/ARMSX2-NEXT27-128MB.apk"

      - name: Verify APK
        shell: bash
        run: |
          test -f ARMSX2-NEXT27-128MB.apk
          unzip -l ARMSX2-NEXT27-128MB.apk | grep 'lib/arm64-v8a/libemucore_4k.so'
          unzip -l ARMSX2-NEXT27-128MB.apk | grep 'lib/arm64-v8a/libemucore_16k.so'
          sha256sum ARMSX2-NEXT27-128MB.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-NEXT27-128MB
          path: ARMSX2-NEXT27-128MB.apk
          if-no-files-found: error
