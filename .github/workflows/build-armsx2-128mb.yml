name: Build ARMSX2 128MB Test

on:
  push:
    branches:
      - chatgpt/armsx2-128mb-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout ARMSX2 source
        uses: actions/checkout@v4
        with:
          repository: SgtBilko76/ARMSX2-3D
          ref: quest-vr-stereo
          path: armsx2
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up current Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 12266719

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Patch ARM64 EE recompiler for 128MB
        shell: bash
        run: |
          cat > /tmp/patch_128mb.py <<'PY'
          from pathlib import Path

          root = Path("armsx2")
          p = root / "pcsx2/arm64/iR5900-arm64.cpp"
          s = p.read_text()

          replacements = [
              ("static u16 manual_page[Ps2MemSize::MainRam / 4096] = {};", "static u16 manual_page[Ps2MemSize::TotalRam / 4096] = {};"),
              ("static u8 manual_counter[Ps2MemSize::MainRam / 4096] = {};", "static u8 manual_counter[Ps2MemSize::TotalRam / 4096] = {};"),
              ("recLutEntries = (Ps2MemSize::MainRam + Ps2MemSize::Rom + Ps2MemSize::Rom1 + Ps2MemSize::Rom2) / 4;", "recLutEntries = (Ps2MemSize::ExposedRam + Ps2MemSize::Rom + Ps2MemSize::Rom1 + Ps2MemSize::Rom2) / 4;"),
              ("curpos += (Ps2MemSize::MainRam / 4);", "curpos += (Ps2MemSize::ExposedRam / 4);"),
              ("if (recRAMCopy.size() != Ps2MemSize::MainRam)", "if (recRAMCopy.size() != Ps2MemSize::ExposedRam)"),
              ("recRAMCopy.resize(Ps2MemSize::MainRam);", "recRAMCopy.resize(Ps2MemSize::ExposedRam);"),
              ("Ps2MemSize::MainRam + Ps2MemSize::Rom + Ps2MemSize::Rom1 + Ps2MemSize::Rom2);", "Ps2MemSize::ExposedRam + Ps2MemSize::Rom + Ps2MemSize::Rom1 + Ps2MemSize::Rom2);"),
              ("if (HWADDR(pc) <= Ps2MemSize::MainRam)", "if (HWADDR(pc) <= Ps2MemSize::ExposedRam)"),
              ("Ps2MemSize::MainRam - oldBlock->startpc);", "Ps2MemSize::ExposedRam - oldBlock->startpc);"),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit("missing expected source: " + old)
              s = s.replace(old, new)

          lines = s.splitlines()
          out = []
          i = 0
          replaced_map = False
          while i < len(lines):
              if lines[i].strip() == "// Map EE RAM (32MB, mirrored)":
                  replaced_map = True
                  while i < len(lines) and lines[i].strip() != "}":
                      i += 1
                  if i >= len(lines):
                      raise SystemExit("unterminated old RAM mapping block")
                  i += 1
                  out.extend([
                      "\t// Map all exposed EE RAM, including the 96 MB devkit extension.",
                      "\tfor (int i = 0; i < static_cast<int>(Ps2MemSize::ExposedRam / _64kb); i++)",
                      "\t{",
                      "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x0000, i, i);",
                      "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x2000, i, i);",
                      "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x3000, i, i);",
                      "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0x8000, i, i);",
                      "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xa000, i, i);",
                      "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xb000, i, i);",
                      "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xc000, i, i);",
                      "\t\trecLUT_SetPage(recLUT, hwLUT, recRAM, 0xd000, i, i);",
                      "\t}",
                  ])
                  continue
              if "MainRam, deliberately" in lines[i]:
                  out.append("\t// Snapshot every byte of currently exposed EE RAM.")
                  i += 5
                  continue
              out.append(lines[i])
              i += 1

          if not replaced_map:
              raise SystemExit("old ARM64 recLUT mapping block not found")
          p.write_text("\n".join(out) + "\n")

          p = root / "pcsx2/Memory.cpp"
          lines = p.read_text().splitlines()
          out = []
          i = 0
          changed = False
          while i < len(lines):
              if lines[i] == "void memSetExtraMemMode(bool mode)":
                  changed = True
                  out.append(lines[i])
                  out.append("{")
                  out.append("\t// NEXT 27 test build: always expose the full devkit memory map.")
                  out.append("\tmode = true;")
                  i += 2
                  while i < len(lines) and "update the amount of RAM exposed to the VM" not in lines[i]:
                      i += 1
                  continue
              out.append(lines[i])
              i += 1
          if not changed:
              raise SystemExit("memSetExtraMemMode not found")
          p.write_text("\n".join(out) + "\n")

          p = root / "pcsx2/Pcsx2Config.cpp"
          s = p.read_text()
          if "\tExtraMemory = false;" not in s:
              raise SystemExit("ExtraMemory default not found")
          p.write_text(s.replace("\tExtraMemory = false;", "\tExtraMemory = true;", 1))
          PY
          python3 /tmp/patch_128mb.py
          if grep -n 'Ps2MemSize::MainRam' armsx2/pcsx2/arm64/iR5900-arm64.cpp; then exit 1; fi
          if grep -n 'Extended RAM (128MB) is not supported' armsx2/pcsx2/Memory.cpp; then exit 1; fi

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Build universal 4K/16K Android APK
        shell: bash
        run: |
          cd armsx2/platforms/android
          chmod +x gradlew tools/build-universal-page-apk.sh
          ./tools/build-universal-page-apk.sh --application-id com.armsx2.next128 "$GITHUB_WORKSPACE/ARMSX2-NEXT27-128MB.apk"

      - name: Verify APK
        shell: bash
        run: |
          test -f ARMSX2-NEXT27-128MB.apk
          unzip -l ARMSX2-NEXT27-128MB.apk | grep 'lib/arm64-v8a/libemucore_4k.so'
          unzip -l ARMSX2-NEXT27-128MB.apk | grep 'lib/arm64-v8a/libemucore_16k.so'
          sha256sum ARMSX2-NEXT27-128MB.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-NEXT27-128MB
          path: ARMSX2-NEXT27-128MB.apk
          if-no-files-found: error
